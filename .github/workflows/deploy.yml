name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # The market strip: rebuild with fresh quotes every two hours (the newsroom's own runs also rebuild).
    - cron: "19 */2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          # One exact release for every workflow and for Cloudflare Pages, which reads the same file. "22" had resolved
          # to the runners' cached 22.23.3, under Astro 7.4's floor of 22.23.4, the security release of 2026-10-20, and
          # the deploy stopped (2026-10-23). Raise it there, once, when a new release is wanted.
          node-version-file: .node-version
          # No npm cache: on 2026-10-30 its restore stalled the weekly review ten minutes ("Egress is over the account limit"), where npm ci takes seconds.
      - run: npm ci --no-audit --no-fund
      - name: Refresh market quotes and the calendar (best effort; the committed files are the fallback)
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: |
          node pipeline/markets.mjs | tee "$RUNNER_TEMP/markets.log"
          node pipeline/calendar.mjs | tee "$RUNNER_TEMP/calendar.log"
          {
            echo "### Data refresh"
            echo ""
            echo "- $(grep '^markets:' "$RUNNER_TEMP/markets.log" | tail -1)"
            echo "- $(grep '^calendar:' "$RUNNER_TEMP/calendar.log" | tail -1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
