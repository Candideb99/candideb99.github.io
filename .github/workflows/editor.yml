name: Editor

# The daily editor's round. It is smart about the owner's Claude tokens (the owner, 2026-09-23: "make
# sure the editor does not run continuously and edit already edited articles so that my claude tokens
# do not get wasted. It should be smart editor"):
#   1. Checks that call no model first (scripts/editor-precheck.mjs): failed newsroom or deploy runs, a
#      broken build, the same event filed twice, a new story without a picture.
#   2. A missing picture is filled by the pipeline's own picture search (a few short Claude calls, like
#      every model call since 2026-09-24), never by the editor round.
#   3. The Claude editor (on the owner's subscription) is woken only when those checks found something
#      only an editor can fix, and then only for that, in at most 40 turns. On a quiet day it is not called.
#   4. The editor never writes or edits articles, so an article is never edited twice by it.
# Once a day; it cannot run continuously (a new round waits for the previous one to finish).
#
# Switch it on once:
#   1. On the laptop: `claude setup-token`, copy the token it prints.
#   2. Repository → Settings → Secrets and variables → Actions:
#        secret   CLAUDE_CODE_OAUTH_TOKEN = that token
#        variable KHAZENDAR_EDITOR        = 1
# Set the variable to 0 to stop it. Nothing else changes; the newsroom keeps publishing either way.

on:
  schedule:
    # Once a day, after the 05:41 explainer run has finished.
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: editor
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  editor:
    name: Daily editor's round
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.KHAZENDAR_EDITOR == '1' && vars.KHAZENDAR_PAUSED != '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Configure git
        run: |
          git config user.name "khazendar-editor"
          git config user.email "editor@users.noreply.github.com"

      - name: Look for work (free checks, no Claude)
        id: precheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/editor-precheck.mjs

      # A new story without a picture is mechanical: the pipeline's own picture search finds one or the story
      # runs as text, and the editor round is not woken for it. Its model calls are Claude's, like every
      # model call since 2026-09-24 (the owner: «abandon free models and use claude only»).
      - name: Install Claude Code (for the picture search)
        if: steps.precheck.outputs.pictures != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Fill missing pictures (the pipeline's own search)
        if: steps.precheck.outputs.pictures != ''
        env:
          SLUGS: ${{ steps.precheck.outputs.pictures }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KHAZENDAR_CLAUDE_MODEL: ${{ vars.KHAZENDAR_CLAUDE_MODEL || 'opus' }}
        run: |
          node pipeline/backfill-images.mjs --only="$SLUGS" || echo "The picture search failed; the stories run as text."
          if [ -n "$(git status --porcelain content/articles)" ]; then
            npm run build
            git add content/articles
            git commit -m "editor: pictures for the newest stories (the pipeline's search)"
            # GitHub sometimes answers a push with a passing 500 (the first run of this step, 2026-09-23).
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              [ "$attempt" = 3 ] && exit 1
              echo "The push failed (attempt $attempt); trying again."
              sleep $((attempt * 15))
            done
          fi

      - name: Check for the subscription token
        id: token
        if: steps.precheck.outputs.work == '1'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            {
              echo "### Editor skipped"
              echo ""
              echo "\`KHAZENDAR_EDITOR\` is set to 1 but the secret \`CLAUDE_CODE_OAUTH_TOKEN\` is missing,"
              echo "so there is no subscription to run Claude on. Add it under Settings → Secrets and"
              echo "variables → Actions, or set \`KHAZENDAR_EDITOR\` to 0 to stop this check."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.precheck.outputs.work == '1' && steps.token.outputs.present == '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The workflow's own token (permissions above), so the action does not depend on the Claude
          # GitHub App: since 2026-09-22 its token exchange answered "Claude Code is not installed on this
          # repository" and every round failed before it began.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: "editor/"
          base_branch: "main"
          additional_permissions: "actions: read"
          # The commands a fix needs, and nothing else (the action allows no shell command by default).
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash(gh run list:*),Bash(gh run view:*),Bash(gh pr create:*),Bash(npm ci),Bash(npm run check),Bash(npm run build),Bash(node scripts/gate.mjs),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git pull:*),Bash(git checkout:*),Bash(git switch:*),Bash(echo:*),Bash(cat:*),Bash(ls:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(sort:*),Read,Edit,Write,Glob,Grep"
          prompt: |
            You are the editor-in-chief of خازندار, an automated Arabic economics news website. You are
            running unattended. The owner, Ahmed, is not watching and cannot answer questions, so decide
            and act. Read CLAUDE.md in this repository first; it holds the house rules and they bind you.

            The free pre-check (scripts/editor-precheck.mjs) has already done the daily round and found
            work that needs an editor. Read editor-findings.md now and handle ONLY what it lists as found;
            what it lists as fine is fine. Do not repeat its checks, do not survey the site, do not read
            the archive. You never write or edit articles: the newsroom writes them and the copy desk
            edits them once, and an article already edited is never edited again.

            How each kind of finding is fixed:
            - A failed newsroom or deploy run: read it with `gh run view <id> --log-failed` and fix the
              cause in the pipeline. The causes seen in production: a feed that changed address, a story
              whose frontmatter breaks the build, a timeout too short for a long call. Every model call is
              Claude's (pipeline/lib/llm.mjs; the owner ruled out the free models on 2026-09-24): an
              expired subscription token or a usage limit cannot be fixed from here, so report it. A story
              rejected by the critic is NOT a bug; leave it.
            - `npm run check` or `npm run build` failing: fix what breaks.
            - The same event filed twice: a de-duplication weakness in pipeline/lib/select.mjs. Tighten
              the rule; do not delete or edit the articles.

            Committing: push fixes to `main` yourself when they are confined to `pipeline/` or `.github/`,
            and only after `npm run check` and `npm run build` pass. Anything touching `src/`,
            `DESIGN.md`, `PRODUCT.md` or `src/data/site.json` changes how the site looks or what it
            promises: open a pull request instead and explain it. Never invent a fact, never hand-write an
            article, never generate a picture, never commit a secret, never force-push.

            You have at most 40 turns; keep the last three for committing and the report. Finish by
            writing a short plain-language report with the Write tool to editor-report.md at the root of
            the repository (never commit it): what you found, what you fixed, what is left.

      # The day's summary: Claude's report when it was needed, and always the free checks, so a quiet day
      # still shows what was looked at.
      - name: Publish the round's summary
        if: always()
        run: |
          if [ -f editor-report.md ]; then
            cat editor-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f editor-findings.md ]; then
            cat editor-findings.md >> "$GITHUB_STEP_SUMMARY"
          fi
