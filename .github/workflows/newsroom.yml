name: Newsroom

on:
  schedule:
    # News every three hours; one explainer and one analysis a day; one research-paper reading on Tuesdays and Fridays.
    - cron: "23 */3 * * *"
    - cron: "41 5 * * *"
    - cron: "7 14 * * *"
    - cron: "31 9 * * 2,5"
    - cron: "37 15 * * 5"
    - cron: "7 10 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: news, explainer, analysis or paper
        default: news
        type: choice
        options: [news, explainer, analysis, paper, weekly]
      limit:
        description: maximum stories to publish
        default: "4"
        type: string

concurrency:
  group: newsroom
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: Write and publish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      published: ${{ steps.newsroom.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Decide mode
        id: mode
        shell: bash
        run: |
          mode="${{ inputs.mode }}"
          sections=""
          if [ -z "$mode" ]; then
            if [ "${{ github.event.schedule }}" = "41 5 * * *" ]; then mode=explainer;
            elif [ "${{ github.event.schedule }}" = "7 14 * * *" ]; then mode=analysis;
            elif [ "${{ github.event.schedule }}" = "31 9 * * 2,5" ]; then mode=paper;
            elif [ "${{ github.event.schedule }}" = "37 15 * * 5" ]; then mode=weekly;
            elif [ "${{ github.event.schedule }}" = "7 10 * * 6" ]; then mode=analysis; sections=defense;
            else mode=news; fi
          fi
          case "$mode" in news|explainer|analysis|paper|weekly) ;; *) echo "invalid mode: $mode"; exit 2;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sections=${sections:-}" >> "$GITHUB_OUTPUT"
          echo "limit=${{ inputs.limit || '4' }}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code (only when the owner's subscription is the provider)
        if: vars.KHAZENDAR_PROVIDER == 'claude'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the newsroom
        id: newsroom
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KHAZENDAR_PROVIDER: ${{ vars.KHAZENDAR_PROVIDER || 'openrouter' }}
          KHAZENDAR_CLAUDE_MODEL: ${{ vars.KHAZENDAR_CLAUDE_MODEL || 'sonnet' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node pipeline/run.mjs --mode=${{ steps.mode.outputs.mode }} --limit=${{ steps.mode.outputs.limit }} --sections=${{ steps.mode.outputs.sections }}

      - name: Refresh market quotes and the calendar
        if: steps.newsroom.outputs.published != '0'
        run: |
          node pipeline/markets.mjs
          node pipeline/calendar.mjs

      - name: Commit new articles
        if: steps.newsroom.outputs.published != '0'
        shell: bash
        run: |
          git config user.name "khazendar-newsroom"
          git config user.email "newsroom@users.noreply.github.com"
          git add content/articles pipeline/state pipeline/runs src/data/markets.json src/data/calendar.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "newsroom: ${{ steps.newsroom.outputs.published }} new ${{ steps.mode.outputs.mode }} item(s)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || true
          done
          git push origin HEAD:main

  deploy:
    name: Build and deploy
    needs: run
    if: needs.run.outputs.published != '0' && needs.run.outputs.published != ''
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
