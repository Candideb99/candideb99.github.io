name: Newsroom

on:
  schedule:
    # News every three hours; one explainer and one analysis a day; one research-paper reading on Tuesdays and Fridays;
    # the week's review on Fridays; the defence-and-geopolitics reading on Saturdays.
    # GitHub fires these crons 1.5-5 hours late and drops some slots; README "How it runs" records the cadence it keeps.
    - cron: "23 */3 * * *"
    - cron: "41 5 * * *"
    - cron: "7 14 * * *"
    - cron: "31 9 * * 2,5"
    - cron: "37 15 * * 5"
    - cron: "7 10 * * 6"
    # «في العمق», the weekly in-depth piece: Sundays, the first working day of the Gulf week (2026-09-24).
    - cron: "47 7 * * 0"
    # Every news round first reads the earlier rounds' stories again against their sources (the second look) and learns
    # from what it proves (the lessons), then writes (2026-09-25; the separate twice-daily second-look run was folded in).
    # The weekly test of the lessons: keep the current ones or put back the last version that passed (Mondays).
    - cron: "13 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: news, explainer, analysis, paper, weekly, feature (في العمق), recheck (the second look) or lessons-test
        default: news
        type: choice
        options: [news, explainer, analysis, paper, weekly, feature, recheck, lessons-test]
      limit:
        description: maximum stories to publish
        default: "4"
        type: string
      sections:
        description: "analysis only: draw on these sections alone, comma-separated (e.g. defense)"
        default: ""
        type: string

concurrency:
  group: newsroom
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # "Pause everything" on the control room sets KHAZENDAR_PAUSED=1; nothing is written or published until it is cleared.
    if: vars.KHAZENDAR_PAUSED != '1'
    name: Write and publish
    runs-on: ubuntu-latest
    # «في العمق» runs longer than a news round: the first one took 32 minutes on its own, and one desk call on a
    # 1,500-word body may take fifteen.
    # A news round also runs the second look and the learning step before it writes: up to 12 and 1 minutes.
    timeout-minutes: ${{ (github.event.schedule == '47 7 * * 0' || inputs.mode == 'feature') && 100 || 65 }}
    outputs:
      published: ${{ steps.newsroom.outputs.published }}
      corrected: ${{ steps.recheck.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Decide mode
        id: mode
        shell: bash
        # The dispatch inputs reach the shell through the environment, never by expansion into the script.
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_SECTIONS: ${{ inputs.sections }}
          SCHEDULE: ${{ github.event.schedule }}
          # Review is on only at "1": the control room switches it off by setting "0", and a test for a non-empty
          # value read that "0" as on (found 2026-09-25: every story would have stayed a draft).
          REVIEW: ${{ vars.KHAZENDAR_REVIEW }}
        run: |
          mode="$INPUT_MODE"
          limit="${INPUT_LIMIT:-4}"
          sections="$INPUT_SECTIONS"
          if [ -z "$mode" ]; then
            if [ "$SCHEDULE" = "41 5 * * *" ]; then mode=explainer;
            elif [ "$SCHEDULE" = "7 14 * * *" ]; then mode=analysis;
            elif [ "$SCHEDULE" = "31 9 * * 2,5" ]; then mode=paper;
            elif [ "$SCHEDULE" = "37 15 * * 5" ]; then mode=weekly;
            elif [ "$SCHEDULE" = "7 10 * * 6" ]; then mode=analysis; sections=defense;
            elif [ "$SCHEDULE" = "47 7 * * 0" ]; then mode=feature;
            elif [ "$SCHEDULE" = "13 6 * * 1" ]; then mode=lessons-test;
            else mode=news; fi
          fi
          case "$mode" in news|explainer|analysis|paper|weekly|feature|recheck|lessons-test) ;; *) echo "invalid mode: $mode"; exit 2;; esac
          review=""
          if [ "$REVIEW" = "1" ]; then review=1; fi
          echo "review=$review" >> "$GITHUB_OUTPUT"
          if ! [[ "$limit" =~ ^[0-9]+$ ]]; then echo "invalid limit: $limit"; exit 2; fi
          if ! [[ "$sections" =~ ^[a-z,]*$ ]]; then echo "invalid sections: $sections"; exit 2; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sections=$sections" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"

      # Every model call is Claude's since 2026-09-24 (the owner: «abandon free models and use claude only»).
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The self-improvement loop, each news round (the owner, 2026-09-25: "each time the LLM gets news ... efficient and
      # fast"): the earlier rounds' stories are read again against their sources, what is proved is corrected, and the
      # proved mistakes become lessons the writer reads before this round's stories. Neither step can stop the round.
      - name: The second look (the earlier rounds' stories)
        id: recheck
        if: steps.mode.outputs.mode == 'news' || steps.mode.outputs.mode == 'recheck'
        continue-on-error: true
        env:
          KHAZENDAR_CLAUDE_MODEL: ${{ vars.KHAZENDAR_CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW: ${{ steps.mode.outputs.review }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$MODE" = recheck ]; then
            node pipeline/recheck.mjs ${REVIEW:+--no-correct}
          else
            node pipeline/recheck.mjs --min-age=2 --limit=6 --backlog=2 --budget=12 ${REVIEW:+--no-correct}
          fi

      - name: Learn from what the second look proved
        if: steps.mode.outputs.mode == 'news' || steps.mode.outputs.mode == 'recheck'
        continue-on-error: true
        timeout-minutes: 5
        env:
          KHAZENDAR_CLAUDE_MODEL: ${{ vars.KHAZENDAR_CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node pipeline/learn.mjs

      - name: Run the newsroom
        id: newsroom
        if: steps.mode.outputs.mode != 'recheck'
        env:
          KHAZENDAR_CLAUDE_MODEL: ${{ vars.KHAZENDAR_CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Photo libraries beside Commons (pipeline/lib/photolibs.mjs); each is used only when its free key is set.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # KHAZENDAR_REVIEW=1 makes the cloud write drafts instead of publishing: they are committed with
          # draft: true, the site ignores them, and the owner approves each one from the control room.
          REVIEW: ${{ steps.mode.outputs.review }}
          MODE: ${{ steps.mode.outputs.mode }}
          LIMIT: ${{ steps.mode.outputs.limit }}
          SECTIONS: ${{ steps.mode.outputs.sections }}
        run: |
          if [ "$MODE" = lessons-test ]; then
            node pipeline/lessons-test.mjs
          else
            node pipeline/run.mjs --mode="$MODE" --limit="$LIMIT" --sections="$SECTIONS" ${REVIEW:+--draft}
          fi

      - name: Refresh market quotes and the calendar (best effort; the committed files are the fallback)
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: |
          node pipeline/markets.mjs | tee "$RUNNER_TEMP/markets.log"
          node pipeline/calendar.mjs | tee "$RUNNER_TEMP/calendar.log"
          {
            echo "### Data refresh"
            echo ""
            echo "- $(grep '^markets:' "$RUNNER_TEMP/markets.log" | tail -1)"
            echo "- $(grep '^calendar:' "$RUNNER_TEMP/calendar.log" | tail -1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs after every newsroom run, published or not: the state (what was rejected or skipped), the
      # run report and the refreshed data are worth keeping even when no story made it.
      - name: Commit the run (articles, state, report, data)
        shell: bash
        env:
          PUBLISHED: ${{ steps.newsroom.outputs.published }}
          CORRECTED: ${{ steps.recheck.outputs.published }}
          DECISION: ${{ steps.newsroom.outputs.decision }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "khazendar-newsroom"
          git config user.email "newsroom@users.noreply.github.com"
          git add content/articles pipeline/state pipeline/runs src/data/markets.json src/data/calendar.json
          fixed=""
          if [ "${CORRECTED:-0}" != "0" ]; then fixed=", ${CORRECTED} corrected"; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          if [ "$MODE" = lessons-test ]; then
            git commit -m "lessons: the weekly test (${DECISION:-not run})"
          elif [ "$MODE" = recheck ]; then
            git commit -m "second look: ${CORRECTED:-0} stor$([ "${CORRECTED:-0}" = 1 ] && echo y || echo ies) corrected"
          elif [ "${PUBLISHED:-0}" = "0" ]; then
            git commit -m "newsroom: state after a $MODE run (0 published$fixed)"
          else
            git commit -m "newsroom: $PUBLISHED new $MODE item(s)$fixed"
          fi
          # Never a silent green: a rebase that cannot apply is aborted and fails the step. In a rebase
          # "theirs" is the commit being replayed, so this run's fresh markets.json and calendar.json
          # win a hunk an owner commit also changed; new article files never conflict.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          echo "push rejected three times"
          exit 1

  deploy:
    name: Build and deploy
    needs: run
    if: (needs.run.outputs.published != '0' && needs.run.outputs.published != '') || (needs.run.outputs.corrected != '0' && needs.run.outputs.corrected != '')
    # The same group as deploy.yml's own runs, declared on the caller job so that a push or scheduled
    # deploy and this one can never publish out of order.
    concurrency:
      group: pages
      cancel-in-progress: true
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
